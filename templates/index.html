<!DOCTYPE html>
<html>
<head>
    <title>DermaXAI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container" style="max-width: 560px; margin: 60px auto; text-align: center;">

        <div class="badge-row">
            <span class="badge">🛡️ AI Powered</span>
            <span class="badge">Early Detection</span>
            <span class="badge">Explainable</span>
        </div>

        <div class="logo-circle">🔬</div>
        <h1 style="margin: 0;">Derma<span style="color: #4a90d9;">XAI</span></h1>
        <p style="color: #666; margin-top: 4px;">Skin lesion detection with explainable AI</p>

        <div class="upload-box" style="margin-top: 25px; text-align: center;">
            <form action="/predict" method="POST" enctype="multipart/form-data">
                <p style="margin: 0 0 6px;">☁️ Drag a dermoscopic image here or choose a file</p>
                <p style="font-size: 12px; color: #888; margin: 0 0 14px;">JPG or PNG</p>
                <input type="file" name="image" accept="image/*" required>
                <br><br>
                <button type="submit" class="btn-predict">🔍 Predict</button>
            </form>
        </div>

        <div class="feature-grid">
            <div class="feature-box">
                <div class="icon">👁️</div>
                <p><strong>Grad-CAM++</strong><br>explanation</p>
            </div>
            <div class="feature-box">
                <div class="icon">🛡️</div>
                <p><strong>7 lesion</strong><br>class detection</p>
            </div>
            <div class="feature-box">
                <div class="icon">🕑</div>
                <p><strong>Prediction</strong><br>history</p>
            </div>
        </div>

        <a href="/history" class="back-link" style="display: block; margin-top: 20px;">View Prediction History</a>
    </div>
</body>
</html>
