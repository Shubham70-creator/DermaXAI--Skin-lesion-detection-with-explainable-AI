<!DOCTYPE html>
<html>
<head>
    <title>Prediction History</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <title>DermaXAI — History</title>
        <table>
            <tr>
                <th>ID</th>
                <th>Predicted Class</th>
                <th>Confidence</th>
                <th>Timestamp</th>
            </tr>
            {% for record in records %}
            <tr>
                <td>{{ record[0] }}</td>
                <td>{{ record[2] }}</td>
                <td>{{ (record[3] * 100) | round(2) }}%</td>
                <td>{{ record[6] }}</td>
            </tr>
            {% endfor %}
        </table>
        <a href="/" class="back-link">← Back to upload</a>
    </div>
</body>
</html>
